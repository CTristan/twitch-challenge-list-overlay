<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta author="jujoco" />
        <meta name="keywords" content="twitch, chat, challengeList, jujoco" />
        <meta name="description" content="A Challenge list for twitch chat" />
        <link
            rel="icon"
            type="image/png"
            href="https://github.githubassets.com/favicons/favicon-dark.png"
        />
        <link rel="stylesheet" type="text/css" href="./styles/index.css" />
        <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
        <script defer src="./_config.js"></script>
        <script defer src="./dist/challengeBot.iife.js"></script>
        <title>Multi Challenge List</title>
    </head>

    <body>
        <main id="app">
            <div class="challenge-wrapper">
                <div class="challenge-container"></div>
            </div>

            <!-- Admin Panel - Only visible when URL fragment is #admin -->
            <div id="admin-panel" class="admin-panel hidden">
                <div class="admin-content">
                    <h2>Twitch Overlay Admin Panel</h2>
                    <p>
                        Manage your overlay configuration and export settings.
                    </p>

                    <!-- Configuration form will be dynamically inserted here by AdminPanel.ts -->
                </div>
            </div>
        </main>

        <div
            id="modal"
            class="modal hidden justify-center items-center absolute"
        >
            <div class="modal-content">
                <h2 class="modal-header">Invalid oAuth access token</h2>
                <div class="modal-body">
                    <p>Possible Reasons:</p>
                    <ul class="modal-list">
                        <li>Token entered incorrectly.</li>
                        <li>
                            Token could have expired. Generate a new access
                            token.
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Add Challenge Modal -->
        <div
            id="add-challenge-modal"
            class="modal hidden justify-center items-center absolute"
        >
            <div class="modal-content">
                <h2 class="modal-header">Add New Challenge</h2>
                <div class="modal-body">
                    <form id="add-challenge-form">
                        <div class="form-group">
                            <label for="add-challenge-title"
                                >Title (required):</label
                            >
                            <input
                                type="text"
                                id="add-challenge-title"
                                class="form-input"
                                placeholder="Enter challenge title"
                                required
                                maxlength="100"
                            />
                        </div>

                        <div class="form-group">
                            <label for="add-challenge-description"
                                >Description (optional):</label
                            >
                            <textarea
                                id="add-challenge-description"
                                class="form-input"
                                placeholder="Enter challenge description"
                                maxlength="200"
                                rows="3"
                            ></textarea>
                        </div>

                        <div class="form-group">
                            <label for="add-challenge-amount"
                                >Amount (optional):</label
                            >
                            <input
                                type="number"
                                id="add-challenge-amount"
                                class="form-input"
                                placeholder="1"
                                min="1"
                                max="999"
                            />
                        </div>

                        <div class="form-group">
                            <label for="add-challenge-timer"
                                >Timer (optional):</label
                            >
                            <input
                                type="text"
                                id="add-challenge-timer"
                                class="form-input"
                                placeholder="e.g., 5m, 30s, 1h"
                            />
                        </div>

                        <div class="form-actions">
                            <button
                                type="submit"
                                id="add-challenge-submit"
                                class="admin-button primary"
                            >
                                Add Challenge
                            </button>
                            <button
                                type="button"
                                id="add-challenge-cancel"
                                class="admin-button"
                            >
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
